# nginx site config — served on container port 80.
# Upstream proxy (nginx-proxy-manager) terminates TLS and forwards here.
#
# Routes handled in the SPA:
#   /              → main app
#   /ats-jobform   → public intake form (no auth)
#   /?intake=1     → same form (legacy / dev)
#
# Anything that isn't a static asset must fall back to index.html so
# React Router-style paths (e.g. /ats-jobform) work after a refresh.

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # Honour the X-Forwarded-Proto from the upstream proxy when computing
    # absolute URLs in any future server-side logic.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # ── gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/xml+rss
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    # ── security headers ────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The intake form posts to the configured webhook from the client,
    # so connect-src needs https: wildcard. Tighten when you know your
    # webhook host.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:;"
        always;

    # ── healthcheck ─────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── hashed Vite assets — cache hard ─────────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────
    # /ats-jobform, /candidates/123, etc. all resolve to index.html so
    # the React router can take over.
    location / {
        # Don't cache index.html — assets are hashed, but the shell
        # should always reflect the latest deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
